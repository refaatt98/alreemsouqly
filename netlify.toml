[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Allow the app to be embedded in an iframe on any other website, and make
# sure direct links / refreshes on deep routes are served by the SPA.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors *"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Lovable CDN assets are host-relative; proxy them before the SPA fallback.
[[redirects]]
  from = "/__l5e/assets-v1/*"
  to = "https://id-preview--9e64349d-8bca-43ae-a210-d89d89d8bf77.lovable.app/__l5e/assets-v1/:splat"
  status = 200
  force = true

# Client-side routing fallback. Data, uploads and push services stay hosted
# independently; Netlify deploys only this frontend.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
